<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#14201b">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c4a44"/></marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- clients -->
  <text x="20" y="40" font-weight="700" font-size="14">Browsers</text>
  <g>
    <rect x="20" y="60" width="180" height="56" rx="10" fill="#e2f1ec" stroke="#0f6b5c"/>
    <text x="110" y="84" text-anchor="middle" font-weight="700">Customer</text><text x="110" y="102" text-anchor="middle" font-size="12">mobile web, family profiles</text>
    <rect x="20" y="132" width="180" height="56" rx="10" fill="#e2f1ec" stroke="#0f6b5c"/>
    <text x="110" y="156" text-anchor="middle" font-weight="700">Pharmacist</text><text x="110" y="174" text-anchor="middle" font-size="12">tablet / desktop</text>
    <rect x="20" y="204" width="180" height="56" rx="10" fill="#e2f1ec" stroke="#0f6b5c"/>
    <text x="110" y="228" text-anchor="middle" font-weight="700">Store staff</text><text x="110" y="246" text-anchor="middle" font-size="12">pick · pack · hand over</text>
    <rect x="20" y="276" width="180" height="56" rx="10" fill="#e2f1ec" stroke="#0f6b5c"/>
    <text x="110" y="300" text-anchor="middle" font-weight="700">Central operations</text><text x="110" y="318" text-anchor="middle" font-size="12">dashboard · stock · rules</text>
  </g>
  <line x1="200" y1="196" x2="246" y2="196" stroke="#3c4a44" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="110" y="364" text-anchor="middle" font-size="12" fill="#5f6e67">HTTPS · HttpOnly SameSite</text>
  <text x="110" y="380" text-anchor="middle" font-size="12" fill="#5f6e67">session cookie · OTP login</text>

  <!-- app -->
  <rect x="250" y="20" width="460" height="560" rx="14" fill="#f5f7f6" stroke="#c3cec8" stroke-width="1.5"/>
  <text x="270" y="46" font-weight="700" font-size="14">Next.js 15 app — one Node.js service (TypeScript)</text>

  <rect x="270" y="60" width="420" height="44" rx="8" fill="#fff" stroke="#c3cec8"/>
  <text x="480" y="87" text-anchor="middle">Pages: React Server Components + small client components</text>

  <rect x="270" y="114" width="205" height="52" rx="8" fill="#fff" stroke="#c3cec8"/>
  <text x="372" y="136" text-anchor="middle" font-weight="700">Server Actions</text><text x="372" y="154" text-anchor="middle" font-size="12">Origin-checked by Next.js</text>
  <rect x="485" y="114" width="205" height="52" rx="8" fill="#fff" stroke="#c3cec8"/>
  <text x="587" y="136" text-anchor="middle" font-weight="700">Route handlers</text><text x="587" y="154" text-anchor="middle" font-size="12">upload (XHR) · private file stream</text>

  <rect x="270" y="176" width="420" height="44" rx="8" fill="#fff" stroke="#c3cec8"/>
  <text x="480" y="203" text-anchor="middle">Auth: OTP · hashed sessions · role + store-scope guards · rate limits</text>

  <rect x="270" y="230" width="420" height="70" rx="8" fill="#fff" stroke="#0f6b5c"/>
  <text x="480" y="253" text-anchor="middle" font-weight="700">Services (explicit actor, transactions, ownership checks)</text>
  <text x="480" y="271" text-anchor="middle" font-size="12">orders · pharmacist review · inventory &amp; routing · prescriptions</text>
  <text x="480" y="288" text-anchor="middle" font-size="12">stock import · refills · policies · test payments · notifications</text>

  <rect x="270" y="310" width="420" height="70" rx="8" fill="#e2f1ec" stroke="#0f6b5c"/>
  <text x="480" y="333" text-anchor="middle" font-weight="700">Domain rules (pure functions, unit-tested)</text>
  <text x="480" y="351" text-anchor="middle" font-size="12">policy resolution + statutory floor · order state machine</text>
  <text x="480" y="368" text-anchor="middle" font-size="12">approval / dispatch gates · nearest-store choice · refill estimate</text>

  <rect x="270" y="390" width="420" height="96" rx="8" fill="#fff" stroke="#c3cec8"/>
  <text x="480" y="412" text-anchor="middle" font-weight="700">Prescription extraction pipeline (draft only)</text>
  <text x="480" y="430" text-anchor="middle" font-size="12">PrescriptionExtractionProvider → timeout → Zod schema → thresholds → catalogue matcher</text>
  <rect x="284" y="442" width="124" height="34" rx="6" fill="#e5f3ea" stroke="#166a3a"/>
  <text x="346" y="464" text-anchor="middle" font-size="12">Local OCR (default)</text>
  <rect x="418" y="442" width="124" height="34" rx="6" fill="#f5f7f6" stroke="#c3cec8"/>
  <text x="480" y="464" text-anchor="middle" font-size="12">Fixture (tests)</text>
  <rect x="552" y="442" width="124" height="34" rx="6" fill="#fff3dc" stroke="#8a5300" stroke-dasharray="4 3"/>
  <text x="614" y="464" text-anchor="middle" font-size="12">Claude vision (opt-in)</text>

  <rect x="270" y="496" width="420" height="70" rx="8" fill="#fff" stroke="#c3cec8"/>
  <text x="480" y="519" text-anchor="middle" font-weight="700">Adapters (mock / test mode)</text>
  <text x="480" y="537" text-anchor="middle" font-size="12">SMS · WhatsApp · in-app notifications (log metadata only)</text>
  <text x="480" y="554" text-anchor="middle" font-size="12">UPI and cash-on-delivery test payments</text>

  <!-- data stores -->
  <rect x="750" y="160" width="190" height="96" rx="10" fill="#e8f0fb" stroke="#1d4f91"/>
  <text x="845" y="184" text-anchor="middle" font-weight="700">PostgreSQL 16</text>
  <text x="845" y="203" text-anchor="middle" font-size="12">via Prisma 6</text>
  <text x="845" y="221" text-anchor="middle" font-size="12">CHECK constraints</text>
  <text x="845" y="239" text-anchor="middle" font-size="12">append-only audit trigger</text>
  <line x1="690" y1="250" x2="746" y2="215" stroke="#3c4a44" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="750" y="290" width="190" height="80" rx="10" fill="#e8f0fb" stroke="#1d4f91"/>
  <text x="845" y="314" text-anchor="middle" font-weight="700">Private file storage</text>
  <text x="845" y="333" text-anchor="middle" font-size="12">AES-256-GCM blobs</text>
  <text x="845" y="351" text-anchor="middle" font-size="12">random names, not web-served</text>
  <line x1="690" y1="285" x2="746" y2="320" stroke="#3c4a44" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="750" y="420" width="190" height="72" rx="10" fill="#fff3dc" stroke="#8a5300" stroke-dasharray="5 4"/>
  <text x="845" y="444" text-anchor="middle" font-weight="700">Anthropic API</text>
  <text x="845" y="463" text-anchor="middle" font-size="12">external · off by default</text>
  <text x="845" y="480" text-anchor="middle" font-size="12">needs explicit opt-in flag</text>
  <line x1="676" y1="459" x2="746" y2="456" stroke="#8a5300" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <rect x="750" y="40" width="190" height="80" rx="10" fill="#fff" stroke="#c3cec8"/>
  <text x="845" y="64" text-anchor="middle" font-weight="700">Daily stock CSV</text>
  <text x="845" y="83" text-anchor="middle" font-size="12">uploaded by operations</text>
  <text x="845" y="101" text-anchor="middle" font-size="12">preview → apply</text>
  <line x1="746" y1="80" x2="694" y2="80" stroke="#3c4a44" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
