<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#14201b">
  <rect width="960" height="690" fill="#fff"/>
  <style>
    .b { fill: #fff; stroke: #c3cec8; stroke-width: 1.3; }
    .k { fill: #e2f1ec; stroke: #0f6b5c; stroke-width: 1.3; }
    .s { fill: #fdeceb; stroke: #b42318; stroke-width: 1.3; }
    .t { font-weight: 700; font-size: 13px; }
    .l { stroke: #5f6e67; stroke-width: 1.4; fill: none; }
    .d { stroke: #5f6e67; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .c { fill: #5f6e67; font-size: 10px; }
  </style>
  <!-- grid: cols 20,210,400,590,780 ; rows 20,160,300,440 ; box 170x70 -->

  <!-- row 0 -->
  <rect class="b" x="20" y="20" width="170" height="70" rx="8"/><text class="t" x="30" y="40">User</text><text x="30" y="58">phone (unique), role</text><text x="30" y="74">storeId?, pharmacistRegNo?</text>
  <rect class="b" x="210" y="20" width="170" height="70" rx="8"/><text class="t" x="220" y="40">FamilyMember</text><text x="220" y="58">customerId, name</text><text x="220" y="74">relation, yearOfBirth?</text>
  <rect class="b" x="400" y="20" width="170" height="70" rx="8"/><text class="t" x="410" y="40">CartItem</text><text x="410" y="58">per family member</text><text x="410" y="74">unique(member, product)</text>
  <rect class="b" x="590" y="20" width="170" height="70" rx="8"/><text class="t" x="600" y="40">Consent</text><text x="600" y="58">type, granted, channel</text><text x="600" y="74">subject (proposal / plan)</text>
  <rect class="b" x="780" y="20" width="170" height="70" rx="8"/><text class="t" x="790" y="40">RefillPlan</text><text x="790" y="58">1:1 approved OrderItem</text><text x="790" y="74">unitsPerDay?, runOut, optedIn</text>

  <!-- row 1 -->
  <rect class="s" x="20" y="160" width="170" height="70" rx="8"/><text class="t" x="30" y="180">Prescription</text><text x="30" y="198">storageKey (encrypted file)</text><text x="30" y="214">mimeType, keyId, status</text>
  <rect class="k" x="210" y="160" width="170" height="70" rx="8"/><text class="t" x="220" y="180">PharmacistReview</text><text x="220" y="198">reviewer + reg. no., outcome</text><text x="220" y="214">verified prescriber/date</text>
  <rect class="k" x="400" y="160" width="170" height="70" rx="8"/><text class="t" x="410" y="180">Order</text><text x="410" y="198">status, routingStatus, storeId</text><text x="410" y="214">prescriptionId (current)</text>
  <rect class="b" x="590" y="160" width="170" height="70" rx="8"/><text class="t" x="600" y="180">PaymentRecord</text><text x="600" y="198">UPI_TEST / COD_TEST</text><text x="600" y="214">+ OrderStatusEvent (history)</text>
  <rect class="b" x="780" y="160" width="170" height="70" rx="8"/><text class="t" x="790" y="180">Store</text><text x="790" y="198">code, lat/lng (demo)</text><text x="790" y="214">staff scope</text>

  <!-- row 2 -->
  <rect class="b" x="20" y="300" width="170" height="70" rx="8"/><text class="t" x="30" y="320">ExtractionRun</text><text x="30" y="338">provider, status</text><text x="30" y="354">overallConfidence, errorCode</text>
  <rect class="k" x="210" y="300" width="170" height="70" rx="8"/><text class="t" x="220" y="320">ReviewItemDecision</text><text x="220" y="338">approve / reject / generic</text><text x="220" y="354">qty, unitsPerDay, reason</text>
  <rect class="k" x="400" y="300" width="170" height="70" rx="8"/><text class="t" x="410" y="320">OrderItem</text><text x="410" y="338">product vs requestedProduct</text><text x="410" y="354">policy snapshot, status</text>
  <rect class="b" x="590" y="300" width="170" height="70" rx="8"/><text class="t" x="600" y="320">StockReservation</text><text x="600" y="338">store, product, qty</text><text x="600" y="354">HELD / CONSUMED / RELEASED</text>
  <rect class="b" x="780" y="300" width="170" height="70" rx="8"/><text class="t" x="790" y="320">InventoryItem</text><text x="790" y="338">onHand, reserved</text><text x="790" y="354">CHECK reserved ≤ onHand</text>

  <!-- row 3 -->
  <rect class="b" x="20" y="440" width="170" height="70" rx="8"/><text class="t" x="30" y="460">ExtractedLine / Field</text><text x="30" y="478">value + confidence per field</text><text x="30" y="494">match status, candidates</text>
  <rect class="k" x="210" y="440" width="170" height="70" rx="8"/><text class="t" x="220" y="460">H1RegisterEntry</text><text x="220" y="478">patient + prescriber details</text><text x="220" y="494">drug, qty, date (1:1 item)</text>
  <rect class="k" x="400" y="440" width="170" height="70" rx="8"/><text class="t" x="410" y="460">SubstitutionProposal</text><text x="410" y="478">original → generic</text><text x="410" y="494">proposedBy, consentId</text>
  <rect class="b" x="590" y="440" width="170" height="70" rx="8"/><text class="t" x="600" y="460">Product</text><text x="600" y="478">strength, form, pricePaise</text><text x="600" y="494">category, genericGroup</text>
  <rect class="k" x="780" y="440" width="170" height="70" rx="8"/><text class="t" x="790" y="460">MedicinePolicy</text><text x="790" y="478">category + version</text><text x="790" y="494">effectiveFrom/To, flags</text>

  <!-- relations (adjacent only) -->
  <line class="l" x1="190" y1="55" x2="210" y2="55"/><text class="c" x="192" y="50">1:n</text>
  <line class="l" x1="380" y1="55" x2="400" y2="55"/>
  <line class="l" x1="320" y1="90" x2="430" y2="160"/><text class="c" x="352" y="120">1:n orders</text>
  <line class="l" x1="190" y1="195" x2="210" y2="195"/>
  <line class="l" x1="380" y1="195" x2="400" y2="195"/><text class="c" x="382" y="190">n:1</text>
  <line class="l" x1="570" y1="195" x2="590" y2="195"/>
  <line class="l" x1="105" y1="230" x2="105" y2="300"/><text class="c" x="110" y="270">1:n runs</text>
  <line class="l" x1="105" y1="370" x2="105" y2="440"/>
  <line class="l" x1="295" y1="230" x2="295" y2="300"/>
  <line class="l" x1="380" y1="335" x2="400" y2="335"/>
  <line class="l" x1="485" y1="230" x2="485" y2="300"/><text class="c" x="490" y="270">1:n items</text>
  <line class="l" x1="570" y1="335" x2="590" y2="335"/>
  <line class="d" x1="760" y1="335" x2="780" y2="335"/>
  <line class="l" x1="865" y1="230" x2="865" y2="300"/>
  <line class="l" x1="790" y1="230" x2="720" y2="300"/>
  <line class="l" x1="420" y1="370" x2="350" y2="440"/><text class="c" x="330" y="414">0..1</text>
  <line class="l" x1="485" y1="370" x2="485" y2="440"/>
  <line class="l" x1="550" y1="370" x2="620" y2="440"/>
  <line class="l" x1="720" y1="440" x2="800" y2="370"/>
  <line class="l" x1="760" y1="475" x2="780" y2="475"/><text class="c" x="752" y="530">by category</text>
  <line class="l" x1="570" y1="475" x2="590" y2="475"/>

  <!-- standalone strip -->
  <rect x="20" y="560" width="930" height="110" rx="10" fill="#f5f7f6" stroke="#c3cec8"/>
  <text class="t" x="34" y="584">Supporting tables</text>
  <text x="34" y="606">AuditEvent — append-only (DB trigger blocks UPDATE/DELETE): actor, action, entity, metadata (ids/codes only)</text>
  <text x="34" y="626">StockImportBatch / StockImportRow — CSV preview with per-row status and error; NotificationLog — mock SMS/WhatsApp/in-app metadata</text>
  <text x="34" y="646">Session (SHA-256 token hash) · OtpChallenge (hashed code, attempts) · RateLimitHit · Locality (demo coordinates for routing)</text>
  <text x="34" y="664" fill="#5f6e67">Green = pharmacist decision &amp; safety records; red = sensitive health data. ExtractedLine.matchedProductId → Product; RefillPlan → OrderItem, Product.</text>
</svg>
